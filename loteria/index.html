<style>html[data-language-loading] body{visibility:hidden}</style><script>/* One explicit origin-wide choice. Never infer a locale from the browser. */
(() => {
 'use strict';
 const KEY='botwave.language.explicit.v1';
 let lang='en';
 try {const saved=localStorage.getItem(KEY);if(saved==='es'||saved==='en')lang=saved;}catch{}
 document.documentElement.lang=lang;
 if(lang==='es')document.documentElement.setAttribute('data-language-loading','');
 function apply(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-en][data-es]').forEach(el=>{el.textContent=el.getAttribute('data-'+lang);});
  for(const attr of ['content','aria-label','alt','title'])document.querySelectorAll('[data-en-'+attr+']').forEach(el=>el.setAttribute(attr,el.getAttribute('data-'+lang+'-'+attr)));
  document.querySelectorAll('[data-site-language]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.siteLanguage===lang)));
  document.documentElement.removeAttribute('data-language-loading');
 }
 function choose(value,origin='site',persist=true){
  if(value!=='en'&&value!=='es')return;
  lang=value;if(persist)try{localStorage.setItem(KEY,value);}catch{}
  apply();window.dispatchEvent(new CustomEvent('botwave:language',{detail:{lang,origin}}));
 }
 window.BotwaveLocale={KEY,get lang(){return lang;},choose,apply};
 document.addEventListener('click',e=>{const button=e.target.closest('button[data-site-language]');if(button)choose(button.dataset.siteLanguage);});
 document.addEventListener('DOMContentLoaded',apply,{once:true});
 window.addEventListener('storage',e=>{if(e.key===KEY)choose(e.newValue==='es'?'es':'en','storage',false);});
})();
</script><meta content="en_US" data-en-content="en_US" data-es-content="es_MX" property="og:locale"/></head>
